<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack Test</title>
    <style>
        /* Minimalist CSS to center the GIF and remove scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            overflow: hidden;
            font-family: sans-serif;
        }
        img {
            max-width: 90%;
            max-height: 70%;
            object-fit: contain;
            border-radius: 8px;
        }
        button {
            margin-top: 15px;
            padding: 8px 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcjQyOHNqcDh0Z3lvaHAyNTE4M20zcWFmZ2pndnYycnFzMXdmM3J1bCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/owRSsSHHoVYFa/giphy.gif" alt="Hack Test GIF">

    <button onclick="closeMe()">Done</button>

    <script>
        function closeMe() {
            // Tells the Lightspeed Parent to close the modal
            window.parent.postMessage(JSON.stringify({
                action: "modal.close"
            }), "*");
        }
    </script>
</body>
</html>
