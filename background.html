<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dennis Nedry - Background Hijacker</title>
</head>
<body>
    <script>
        /**
         * 1. THE SETUP
         * Replace the URL below with the one from your Pipedream HTTP Trigger.
         */
        const PIPEDREAM_URL = "https://eo6vclj7udfr512.m.pipedream.net";
        const GITHUB_GIF_PAGE = "https://carmenselene.github.io/sell-screen-hijack-testing/sell-screen-hack-test.html";

        // Notify Lightspeed that the background script is ready
        window.parent.postMessage(JSON.stringify({ action: "register" }), "*");

        /**
         * 2. THE LISTENER
         * We listen for messages from the Lightspeed Sell Screen.
         */
        window.addEventListener("message", (event) => {
            try {
                // Parse the data coming from Lightspeed
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;

                // TRIGGER: Every time a product is added to the cart
                if (data.action === "sale.line_item.added") {
                    
                    console.log("Hijack initiated for Sale ID:", data.payload.sale_id);

                    // A. THE SILENT PING (To Pipedream)
                    // This sends the Sale ID to Pipedream so your Node.js step can "hack" it.
                    fetch(PIPEDREAM_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            sale_id: data.payload.sale_id,
                            triggered_by: "Nedry Hijack"
                        })
                    }).catch(err => console.error("Pipedream Ping Failed:", err));

                    // B. THE VISUAL POPUP (To the User)
                    // This triggers the GIF modal inside the Sell Screen.
                    window.parent.postMessage(JSON.stringify({
                        action: "modal.open",
                        data: {
                            url: GITHUB_GIF_PAGE,
                            title: "System Security Alert",
                            size: "small"
                        }
                    }), "*");
                }
            } catch (e) {
                // This catch avoids errors from other non-JSON messages in the POS
            }
        });
    </script>
</body>
</html>
